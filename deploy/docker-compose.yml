# 制度问答台 —— 整套部署（本机 Windows + Cloudflare Tunnel 形态）
#
# 用法（在 D:\policy-desk\deploy 下）：
#   1. 先构建 Java 产物：mvn -f ../apps/api/pom.xml package
#   2. cp .env.example .env   然后填三个口令
#   3. docker compose up -d --build
#   4. 浏览器打开 http://localhost:8080
#
# ★ 只暴露 web 的 8080，其它三个（mysql / redis / api / ai）都只在内部网络。
#   把一个带数据库的机器暴露到公网，是这类项目最常见、也最不可原谅的事故。

services:
  mysql:
    image: mysql:8.0
    # ★ 不写 ports：容器之间用服务名互相访问，宿主不需要，公网更不需要
    environment:
      MYSQL_DATABASE: policy_desk
      MYSQL_USER: policy
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 里设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 里设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # ★ 只在**数据卷为空**（首次启动）时执行；之后改 DDL 要么手动迁移，要么删卷重来。
      #   把这条写进文档，否则"我改了 init.sql 怎么没生效"会浪费一小时。
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "policy", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    # ★ 算法服务在另一个仓库：要求两个仓库并排克隆（policy-desk 与 _review_rag-cs）。
    #   这是"业务仓库 + 算法仓库"的常态，但必须写进文档，否则只拿到一个 repo 的人会懵。
    build:
      context: ../../_review_rag-cs
    image: policy-desk-ai:local
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      # ★ 内部接口要求角色必须有来源（AUTH_MODE=none 时 /internal/* 直接 503）
      AUTH_MODE: proxy
      TRUST_PROXY_HEADERS: "1"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 deploy/.env 里设置 INTERNAL_TOKEN}
      # 生成走 DeepSeek：密钥从算法仓库的 .env 读（不进镜像、不进本仓库）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 deploy/.env 里设置 DEEPSEEK_API_KEY}
      TZ: Asia/Shanghai
    volumes:
      # 模型缓存（92MB）：挂卷之后重建镜像不用重下
      - model-cache:/root/.cache/fastembed
      # 企业语料：持久化，重建容器不丢
      - ai-data:/app/kb_data
    healthcheck:
      # 冷启动要下模型，start_period 给足；这段时间 /health 是 loading，不算失败
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  api:
    build:
      context: ../apps/api
    image: policy-desk-api:local
    environment:
      SERVER_PORT: "8081"
      DB_URL: "jdbc:mysql://mysql:3306/policy_desk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: policy
      DB_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 里设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 里设置 JWT_SECRET（>= 32 字节）}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 deploy/.env 里设置 INTERNAL_TOKEN}
      PYTHON_AI_URL: "http://ai:8000"
      # 演示账号：首次启动插 hr_demo / emp_demo（表空才插，幂等）
      SEED_DEMO_USERS: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-policy123}
      # 配额走 Redis（部署形态）；内存实现重启清零，不该用在部署里
      QUOTA_BACKEND: redis
      REDIS_HEALTH_ENABLED: "true"
      REDIS_HOST: redis
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: ../apps/web
    image: policy-desk-web:local
    ports:
      # ★ 唯一的对外端口。宿主 → 容器 80。
      #   默认 8088 而不是 8080：本机 8080 被 WSL 的端口转发（wslrelay）占着，
      #   compose 会直接报 "port is already allocated"。用变量是为了换机器时不用改文件。
      - "${WEB_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  model-cache:
  ai-data:
