server {
    listen 80;
    server_name _;

    # ★ 与 Java 的 multipart 上限（20MB）对齐。
    #   nginx 默认 1M，超了直接 413，而且错误页是 nginx 的 HTML —— 前端拿不到 detail，
    #   只能显示"请求失败"。两处必须一起改，这是最容易被漏掉的一对配置。
    client_max_body_size 20m;

    # 前端的静态文件
    root /usr/share/nginx/html;
    index index.html;

    # ★ 单页应用要 fallback 到 index.html：
    #   直接访问 /docs 时 nginx 会去找 /docs 这个文件（不存在）→ 404。
    #   用户刷新页面就白屏，而这不是前端 bug。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存（内容变了文件名会变）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 Java。★ 用服务名 `api`，不是 localhost —— 容器里 localhost 是它自己。
    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 问答要跑 3-5 秒（改写+精排+生成），默认 60s 够；写长一点防止极端慢查询被掐
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
