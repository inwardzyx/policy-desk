# ---- 入口层的按 IP 限速 / 限并发（2026-11-21）----
# ★ 为什么把"拒绝"放在入口而不是应用里：
#   实测（campus-policy-rag `experiments/noisy-neighbor.md` §十）：每秒上千次「拒绝」本身
#   就能把**应用进程**的事件循环占满 —— 那时连不碰检索的 `/health` 都慢了 30 倍。
#   放到 nginx（C 进程、自己的事件循环）之后，同样的风暴只让入口忙，应用只看到被放行的部分：
#   邻居的 p95 劣化从 +623% 降到 +179%（同一台应用、同款客户端）。
# ★ 键为什么是 `$binary_remote_addr`：nginx 手上只有这个**不会撒谎**的标识。
#   `X-Client-Id` / `X-User` 这类自称头谁都能伪造（Python 侧 `limits.py` 默认就不信它们，
#   要显式开 `ALLOW_CLIENT_ID_HEADER` 才认）。
#   ⚠️ 代价写在明面上：**办公室共用一个出口 IP 时，几个人共享同一个桶** —— 所以阈值给得宽。
#   等有了可信的租户标识（Java 侧下发 / 网关注入），把键换成它即可，其它一行不动。
limit_req_zone  $binary_remote_addr zone=api_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    server_name _;

    # ★ 与 Java 的 multipart 上限（20MB）对齐。
    #   nginx 默认 1M，超了直接 413，而且错误页是 nginx 的 HTML —— 前端拿不到 detail，
    #   只能显示"请求失败"。两处必须一起改，这是最容易被漏掉的一对配置。
    client_max_body_size 20m;

    # 前端的静态文件
    root /usr/share/nginx/html;
    index index.html;

    # ★ 单页应用要 fallback 到 index.html：
    #   直接访问 /docs 时 nginx 会去找 /docs 这个文件（不存在）→ 404。
    #   用户刷新页面就白屏，而这不是前端 bug。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存（内容变了文件名会变）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 Java。★ 用服务名 `api`，不是 localhost —— 容器里 localhost 是它自己。
    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 问答要跑 3-5 秒（改写+精排+生成），默认 60s 够；写长一点防止极端慢查询被掐
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # ① 速率：每 IP 10 r/s、burst 20（一次问答 3–5 秒，正常用户远达不到）
        #    超了直接 429，**不排队** —— 排队等于把连接占住。
        limit_req zone=api_rate burst=20 nodelay;
        limit_req_status 429;
        # ② 并发连接：每 IP 最多 12 条。★ 不能设太小：SSE 流式回答会**一直占着连接**
        #    （一次生成 5–30 秒），浏览器同域还会并发开好几条，设 8 会把正常用户挡掉。
        limit_conn api_conn 12;
        limit_conn_status 429;
        # ③ 被限时告诉客户端"等一会儿"：不带这个头，客户端会立刻重打 —— 那正是拒绝风暴的来源。
        #    ⚠️ `always` 会让 200 响应也带这个头，无害（客户端只对 429/503 读它），
        #    换来的是"被限流时自动退避"，这个交换在本项目里踩过坑、值得。
        add_header Retry-After 2 always;
    }
}
